name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository tree (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          find . -maxdepth 3 -type f -print || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (verbose)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # garantir pytest sempre
          python -m pip install pytest
          # instalar demais dependÃªncias se existir arquivo
          if [ -f requirements-dev.txt ]; then
            echo "requirements-dev.txt found; installing..."
            cat requirements-dev.txt || true
            python -m pip install -r requirements-dev.txt || true
          else
            echo "requirements-dev.txt not found; skipped"
          fi
          echo "Python executable:"
          which python || true
          echo "Python version:"
          python --version || true
          echo "pip list (top 200):"
          python -m pip list --format=columns | sed -n '1,200p' || true
          echo "pytest show:"
          python -m pip show pytest || true
      - name: Start mock client in background
        run: |
          mkdir -p ci-logs
          nohup python -u mock_client/mock_client.py > ci-logs/mock.log 2>&1 &
          echo "Mock started (background). Logs: ci-logs/mock.log"

      - name: Wait for mock /status
        run: |
          set -e
          MAX_WAIT=60
          SLEEP=1
          elapsed=0
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/status)" = "200" ]; do
            elapsed=$((elapsed + SLEEP))
            if [ $elapsed -ge $MAX_WAIT ]; then
              echo "Timeout waiting for mock /status"
              echo "---- Last mock log ----"
              tail -n 200 ci-logs/mock.log || true
              exit 1
            fi
            sleep $SLEEP
          done
          echo "/status is up"

      - name: Run pytest (collect + run, verbose)
        run: |
          echo "PWD: $(pwd)"
          echo "Listing top-level files:"
          ls -la || true
          echo "Listing tests/ (if exists):"
          ls -la tests || true
          echo "pytest collect-only:"
          python -m pytest --collect-only -vv || true
          echo "pytest verbose run (shows skipped/collected):"
          python -m pytest -vv -r a || true
        env:
          PYTHONUNBUFFERED: 1
      - name: Upload mock logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-log
          path: ci-logs/mock.log
