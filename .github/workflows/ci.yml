name: CI Autoformat Lint Test and Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1

jobs:
  format-and-lint:
    name: Autoformat and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install formatting and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install isort black ruff
        shell: bash

      - name: Run isort (autoformat)
        run: |
          isort .
        shell: bash

      - name: Run black (autoformat)
        run: |
          black .
        shell: bash

      - name: Show formatting diff
        run: |
          git --no-pager diff --name-only || true
        shell: bash

      - name: Run ruff (fail on lint errors)
        run: |
          ruff check .
        shell: bash

  test:
    name: Run tests on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: format-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.11, 3.10]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -U pytest
        shell: bash

      - name: Run tests
        run: |
          pytest -q
        shell: bash

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\pip\Cache
          key: windows-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            windows-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { pip install -U pyinstaller }
        shell: powershell

      - name: Install PyInstaller
        run: |
          pip install pyinstaller
        shell: powershell

      - name: Build executable with PyInstaller
        run: |
          # Ajuste o entrypoint se necessário (ex: src\cli.py)
          pyinstaller --onefile --name myapp src\cli.py
        shell: powershell

      - name: List dist folder
        run: dir dist
        shell: powershell

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-windows
          path: dist/myapp.exe
          retention-days: 7
